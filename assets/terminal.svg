<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Terminal: whoami – Marie Christin Eilers, Product Owner with agricultural domain expertise. Impact: Just Farming 0 to 28,000 users, led product. Invoicing: first invoice in minutes, not a 2-hour setup. John Deere: customer insight and pricing. Now: Claude Code plugins, AI-native SDLC. Motto: Make it simple, but significant.">
  <style>
    text { white-space: pre; }
    .l { animation: in .01s linear backwards; }
    @keyframes in { from, to { opacity: 0; } }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
      .cur { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="638" rx="16" fill="#10201A" stroke="#24402F" stroke-width="2"/>
  <path d="M1 17 A16 16 0 0 1 17 1 H1183 A16 16 0 0 1 1199 17 V46 H1 Z" fill="#182C22"/>
  <circle cx="30" cy="24" r="7" fill="#E5645B"/>
  <circle cx="54" cy="24" r="7" fill="#E7C37E"/>
  <circle cx="78" cy="24" r="7" fill="#7FB685"/>
  <text x="600" y="29" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#8EA394">marie@field — zsh</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#E9E4D4" xml:space="preserve">
    <text x="40" y="98" class="l" style="animation-delay:.3s"><tspan fill="#8FC79A">$</tspan> whoami</text>
    <text x="40" y="130" class="l" style="animation-delay:.8s">Marie Christin Eilers · Product Owner with agricultural domain expertise</text>

    <text x="40" y="190" class="l" style="animation-delay:1.4s"><tspan fill="#8FC79A">$</tspan> cat impact.txt</text>
    <text x="40" y="222" class="l" style="animation-delay:1.9s">  <tspan fill="#E7C37E">Just Farming </tspan>  0 → 28,000 users, led product</text>
    <text x="40" y="254" class="l" style="animation-delay:2.2s">  <tspan fill="#E7C37E">Invoicing    </tspan>  first invoice in minutes, not a 2-hour setup</text>
    <text x="40" y="286" class="l" style="animation-delay:2.5s">  <tspan fill="#E7C37E">John Deere   </tspan>  customer insight &amp; pricing</text>

    <text x="40" y="346" class="l" style="animation-delay:3.1s"><tspan fill="#8FC79A">$</tspan> ls ~/now</text>
    <text x="40" y="378" class="l" style="animation-delay:3.6s" fill="#8FC79A">  claude-code-plugins/   ai-native-sdlc/</text>

    <text x="40" y="438" class="l" style="animation-delay:4.2s"><tspan fill="#8FC79A">$</tspan> echo $MOTTO</text>
    <text x="40" y="470" class="l" style="animation-delay:4.7s" fill="#E7C37E">Make it simple, but significant.</text>

    <text x="40" y="530" class="l" style="animation-delay:5.2s"><tspan fill="#8FC79A">$</tspan> <tspan class="cur">▍</tspan></text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#3E6B48" xml:space="preserve">
    <text x="40" y="592">  \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/    \|/</text>
    <text x="40" y="614" fill="#6B4F3A">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</text>
  </g>
</svg>
